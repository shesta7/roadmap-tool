<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product roadmap</title>
  <link rel="stylesheet" href="/static/roadmap.css">
  <link rel="stylesheet" href="/static/timeline-fix.css">
  <link rel="stylesheet" href="/static/product-polish.css">
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <p class="eyebrow">Product planning</p>
        <h1>Roadmap</h1>
        <p id="subtitle">Milestones and planned work</p>
      </div>
      <div class="header-actions">
        <a class="github-link" href="https://github.com/shesta7/roadmap-tool" target="_blank" rel="noopener noreferrer" aria-label="Open roadmap-tool on GitHub" title="Open roadmap-tool on GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.94 10.94 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.71 5.38-5.29 5.67.42.36.78 1.06.78 2.14v3.18c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
        </a>
        <span id="connection" class="connection">Not connected</span>
        <button id="themeBtn" type="button">Theme: auto</button>
        <button id="settingsBtn" class="primary" type="button">Settings</button>
      </div>
    </header>

    <div id="notice" class="notice" hidden></div>
    <div id="error" class="error" hidden></div>
    <section id="timeline" class="timeline" aria-label="Milestone timeline"></section>
    <div class="roadmap-tools">
      <label class="filter-field">
        <span>Filter roadmap</span>
        <input id="filterInput" type="search" placeholder="Milestone, description, or issue" autocomplete="off">
      </label>
      <div class="date-filter" role="group" aria-label="Timeline date range">
        <label>From <input id="dateFrom" type="date"></label>
        <label>To <input id="dateTo" type="date"></label>
      </div>
      <div class="view-actions">
        <button id="issuesToggleBtn" type="button">Issue points: shown</button>
        <button id="monthsToggleBtn" type="button">Months: shown</button>
        <button id="detailsBtn" type="button">Show all details</button>
      </div>
    </div>
    <p id="noResults" class="no-results" hidden>No milestones match this filter.</p>
    <section id="milestones" class="milestones" aria-live="polite"></section>
  </main>

  <dialog id="settingsDialog">
    <form id="settingsForm">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Local configuration</p>
          <h2>Settings</h2>
        </div>
        <button id="closeSettings" class="quiet" type="button">Close</button>
      </div>

      <fieldset>
        <legend>Repository</legend>
        <div class="form-grid">
          <label>Provider
            <select name="provider">
              <option value="github">GitHub</option>
              <option value="gitlab">GitLab</option>
              <option value="gitea">Gitea</option>
            </select>
          </label>
          <label>Base URL <input name="base_url" placeholder="https://api.github.com"></label>
          <label>Owner or organization <input name="owner" required></label>
          <label>Repository <input name="repository" required></label>
          <label>Issue label <input name="feature_label" required></label>
          <label>Default theme
            <select name="theme_default">
              <option value="auto">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Colors</legend>
        <div id="colors" class="color-groups"></div>
      </fieldset>

      <fieldset>
        <legend>Access token</legend>
        <p class="help">Stored locally in a separate file. It is never returned by the API or included in exports.</p>
        <div class="token-row">
          <input id="tokenInput" type="password" autocomplete="off" placeholder="Paste a token">
          <button id="connectBtn" type="button">Save token</button>
          <button id="disconnectBtn" class="danger" type="button">Disconnect</button>
        </div>
      </fieldset>

      <div class="dialog-footer">
        <div>
          <button id="importBtn" class="quiet" type="button">Import JSON</button>
          <a class="button quiet" href="/api/config/export" download>Export JSON</a>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
        </div>
        <button class="primary" type="submit">Save settings</button>
      </div>
      <p id="settingsMessage" class="form-message" aria-live="polite"></p>
    </form>
  </dialog>

  <script src="/static/roadmap.js"></script>
</body>
</html>
